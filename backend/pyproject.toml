[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osint-shield-backend"
version = "0.1.0"
description = "OSINT Shield backend service providing ingestion, NLP, and APIs"
authors = [{ name = "OSINT Shield Team", email = "security@osintshield.eu" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.29.0",
  "sqlalchemy>=2.0.30",
  "greenlet>=3.0.3",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.1",
  "aiosqlite>=0.20.0",
  "httpx>=0.27.0",
  "scikit-learn>=1.4.2",
  "spacy>=3.7.4",
  "python-dotenv>=1.0.1",
  "alembic>=1.13.1"
]

[project.urls]
Homepage = "https://github.com/example/osint-shield"

[tool.uv]
package = true


[tool.setuptools.packages.find]
include = ["app*"]

[dependency-groups]
dev = [
    "mypy>=1.18.2",
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.5.0",
]
